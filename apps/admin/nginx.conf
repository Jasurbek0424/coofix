# Static SPA. /api and /media are routed by Caddy to the API before reaching this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never serve the SPA shell for API paths (misrouting should fail loudly).
    location /api/ {
        return 404;
    }

    # SPA fallback; index.html must always revalidate so new deploys are picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
