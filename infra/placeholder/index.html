<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COOFIX — инструменты и оборудование</title>
<meta name="robots" content="noindex">
<style>
  :root { --brand: #f05a00; --ink: #171a1b; --muted: #6b7275; --bg: #f2f5f7; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f5f7; --muted: #9aa3a6; --bg: #171a1b; } }
  * { box-sizing: border-box; margin: 0 }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink) }
  main { max-width: 520px; text-align: center }
  .mark { width: 56px; height: 56px; margin: 0 auto 28px; background: var(--brand);
          clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%) }
  h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.02em; line-height: 1.1 }
  h1 span { color: var(--brand) }
  p { margin-top: 16px; color: var(--muted) }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>COOFIX <span>скоро</span> откроется</h1>
  <p>Мы обновляем магазин инструментов и оборудования. Совсем скоро здесь появится новый каталог.</p>
</main>
</body>
</html>
