# Production stack. Runs on the server from /opt/coofix/app (git checkout).
# Secrets live in /opt/coofix/.env (never committed).
name: coofix
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coofix
      POSTGRES_DB: coofix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coofix"]
      interval: 5s
      retries: 20
    shm_size: 128mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: /opt/coofix/.env
    environment:
      COOFIX_ENV: prod
      COOFIX_DATABASE_URL: postgresql+asyncpg://coofix:${POSTGRES_PASSWORD}@postgres:5432/coofix
      COOFIX_REDIS_URL: redis://redis:6379/0
      COOFIX_COOKIE_SECURE: "true"
      COOFIX_CORS_ORIGINS: '["https://coofix.store","https://coofix.online"]'
      COOFIX_MEDIA_ROOT: /data/media
      COOFIX_MEDIA_URL: https://coofix.store/media
    volumes: [media:/data/media]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  admin:
    build: ../apps/admin
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./placeholder:/srv/placeholder:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, admin]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
